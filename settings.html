<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Settings</title>
<link rel="stylesheet" href="Admin_Dashboard.css">

<style>

.settings-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:20px;
margin-top:20px;
}

.settings-card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.settings-card h3{
margin-bottom:15px;
}

.toggle{
display:flex;
justify-content:space-between;
align-items:center;
margin:10px 0;
}

.settings-card button{
padding:10px 15px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.danger-btn{
background:#e53935;
color:white;
}

</style>

</head>

<body>

<div class="dashboard">

<aside class="sidebar">

<h1>📚 NEU Library</h1>

<nav>
<ul>

<li><a href="Admin_dashboard.html">Dashboard</a></li>
<li><a href="users.html">Users</a></li>
<li><a href="logs.html">Logs</a></li>
<li><a href="chart.html">Stats</a></li>
<li class="active"><a href="settings.html">Settings</a></li>

</ul>
</nav>

</aside>

<main class="main-content">

<header class="topbar">
<h2>System Settings</h2>

<div class="user-info">
<span>Admin</span>
</div>

</header>

<div class="content">

<div class="settings-grid">


</div>

<div class="settings-card">

<h3>🚪 Account</h3>

<button class="danger-btn" onclick="logout()">Logout</button>

</div>

</div>

</div>

</main>

</div>

<script>


function logout(){
alert("Logged out");
window.location.href="index.html";
}
</script>

</body>
</html>
